<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ Café | Digital Menu</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f4ef;color:#2d2118;padding-bottom:90px}
header{background:#2d2118;color:#fff;padding:28px 20px;text-align:center}
header h1{font-size:30px;letter-spacing:1px}
header p{margin-top:8px;color:#d8c3a5;font-size:14px}
.categories{display:flex;overflow-x:auto;gap:10px;padding:14px;background:#fff;position:sticky;top:0;z-index:10}
.categories button{border:none;background:#eee7dd;color:#2d2118;padding:10px 16px;border-radius:25px;white-space:nowrap;font-weight:bold}
.menu{padding:18px 12px;max-width:900px;margin:auto}
.category-title{margin:20px 5px 12px;font-size:22px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08)}
.item img{width:100%;height:180px;object-fit:cover}
.item-info{padding:15px}.item h3{margin-bottom:6px}
.description{font-size:13px;color:#777;margin-bottom:12px}
.item-bottom{display:flex;justify-content:space-between;align-items:center}
.price{font-size:18px;font-weight:bold}
.add-btn{background:#2d2118;color:#fff;border:none;padding:9px 15px;border-radius:10px;font-weight:bold}
.cart{position:fixed;bottom:0;left:0;width:100%;background:#2d2118;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;z-index:100}
.cart small{color:#d8c3a5}.cart-info{display:flex;flex-direction:column}
.cart button{background:#d8c3a5;color:#2d2118;border:none;padding:10px 16px;border-radius:10px;font-weight:bold}
.cart-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200}
.cart-content{position:absolute;bottom:0;background:#fff;width:100%;border-radius:22px 22px 0 0;padding:22px;max-height:75vh;overflow-y:auto;color:#2d2118}
.cart-content h2{margin-bottom:15px}.cart-item{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eee}
.quantity{display:flex;align-items:center;gap:10px}.quantity button{width:30px;height:30px;border:none;border-radius:50%;background:#2d2118;color:#fff;font-size:18px}
.cart-total{margin-top:20px;font-size:22px;font-weight:bold;display:flex;justify-content:space-between}
.close-btn{width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:#2d2118;color:#fff;font-weight:bold}
</style>
</head>
<body>
<header><h1>☕ XYZ Café</h1><p>Good Food • Good Coffee • Good Mood</p></header>
<div class="categories">
<button onclick="go('coffee')">☕ Coffee</button><button onclick="go('sandwiches')">🥪 Sandwiches</button>
<button onclick="go('pizza')">🍕 Pizza</button><button onclick="go('burgers')">🍔 Burgers</button><button onclick="go('desserts')">🍰 Desserts</button>
</div>
<div class="menu" id="menu"></div>
<div class="cart"><div class="cart-info"><small id="count">0 items</small><strong id="total">₹0</strong></div><button onclick="openCart()">View Selection 🛒</button></div>
<div class="cart-modal" id="modal"><div class="cart-content"><h2>Your Selection 🛒</h2><div id="cartItems"></div><div class="cart-total"><span>Total</span><span id="modalTotal">₹0</span></div><button class="close-btn" onclick="closeCart()">Continue Browsing</button></div></div>
<script>
const items=[
['coffee','☕ Coffee','Cappuccino','Rich espresso with creamy milk foam.',140,'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=800&q=80'],
['coffee','☕ Coffee','Cold Coffee','Chilled, creamy and refreshing.',160,'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?auto=format&fit=crop&w=800&q=80'],
['sandwiches','🥪 Sandwiches','Veg Grilled Sandwich','Fresh vegetables and delicious cheese.',180,'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=800&q=80'],
['pizza','🍕 Pizza','Margherita Pizza','Classic cheese pizza with tomato sauce.',249,'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=800&q=80'],
['burgers','🍔 Burgers','Classic Veg Burger','Crispy patty with fresh vegetables.',199,'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80'],
['desserts','🍰 Desserts','Chocolate Cake','Rich and delicious chocolate cake.',150,'https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=80']
];
const menu=document.getElementById('menu');
const groups={};
items.forEach(x=>(groups[x[0]]??=[]).push(x));
for(const id in groups){menu.innerHTML+=`<h2 class="category-title" id="${id}">${groups[id][0][1]}</h2><div class="menu-grid">${groups[id].map(x=>`<div class="item"><img src="${x[5]}" alt="${x[2]}"><div class="item-info"><h3>${x[2]}</h3><p class="description">${x[3]}</p><div class="item-bottom"><span class="price">₹${x[4]}</span><button class="add-btn" onclick='add(${JSON.stringify(x[2])},${x[4]})'>Add +</button></div></div></div>`).join('')}</div>`}
let cart={};
function add(n,p){cart[n]?cart[n].q++:cart[n]={p,q:1};update()}
function change(n,d){cart[n].q+=d;if(cart[n].q<=0)delete cart[n];update();render()}
function update(){let q=0,t=0;Object.values(cart).forEach(x=>{q+=x.q;t+=x.q*x.p});count.textContent=q+(q===1?' item':' items');total.textContent='₹'+t;modalTotal.textContent='₹'+t}
function openCart(){modal.style.display='block';render()}
function closeCart(){modal.style.display='none'}
function render(){cartItems.innerHTML=Object.keys(cart).length?Object.entries(cart).map(([n,x])=>`<div class="cart-item"><div><strong>${n}</strong><br><small>₹${x.p} each</small></div><div class="quantity"><button onclick='change(${JSON.stringify(n)},-1)'>−</button><strong>${x.q}</strong><button onclick='change(${JSON.stringify(n)},1)'>+</button></div></div>`).join(''):'<p>Your selection is empty.</p>'}
function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}
</script>
</body></html>
